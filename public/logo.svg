<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ashok Sanghavi">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15523A"/>
      <stop offset="1" stop-color="#0C3222"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C877"/>
      <stop offset="1" stop-color="#BE9742"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="55%">
      <stop offset="0" stop-color="#E7C877" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E7C877" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep emerald field (corners are clipped by the round frame) -->
  <rect width="512" height="512" fill="url(#disc)"/>

  <!-- Faint crafted ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#C6A253" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Soft dawn glow -->
  <circle cx="256" cy="300" r="140" fill="url(#glow)"/>

  <!-- Rays of a rising sun -->
  <g stroke="#D9BE7E" stroke-width="7" stroke-linecap="round" stroke-opacity="0.92">
    <line x1="256" y1="196" x2="256" y2="160"/>
    <line x1="313" y1="214" x2="335" y2="186"/>
    <line x1="199" y1="214" x2="177" y2="186"/>
    <line x1="352" y1="252" x2="382" y2="235"/>
    <line x1="160" y1="252" x2="130" y2="235"/>
  </g>

  <!-- Rising sun (upper half-dome) -->
  <path d="M 184 300 A 72 72 0 0 1 328 300 Z" fill="url(#sun)"/>

  <!-- Horizon -->
  <line x1="112" y1="300" x2="400" y2="300" stroke="#F5F0E6" stroke-width="10" stroke-linecap="round"/>
  <line x1="150" y1="318" x2="362" y2="318" stroke="#C6A253" stroke-width="5" stroke-linecap="round" stroke-opacity="0.75"/>
</svg>
